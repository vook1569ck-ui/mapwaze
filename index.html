<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062c35">
<title>مابويز | ملاحتك داخل العراق</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--navy:#062c35;--teal:#00b7a5;--mint:#d9fff8;--ink:#102a31;--muted:#657a80;--panel:#fff;--bg:#edf4f3;--line:#e3eceb;--danger:#d94b4b;--shadow:0 10px 32px #052b351c}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}body{overflow:hidden}
#map{position:absolute;inset:0;z-index:1;background:#e5eeee}
.leaflet-control-attribution{font-size:9px!important}
.top{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.brand,.searchbox,.status,.bottom{pointer-events:auto}
.brand{background:var(--navy);color:white;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow)}
.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#13dbc3,#008d84);display:grid;place-items:center;font-size:24px;box-shadow:inset 0 0 0 1px #ffffff45}
.brandname{font-size:21px;font-weight:850;letter-spacing:.2px}.tag{font-size:11px;color:#b7d8d8;margin-top:2px}.spacer{flex:1}
.pill{font-size:11px;background:#124650;color:#bffcf4;padding:6px 9px;border-radius:999px}
.searchbox{display:flex;gap:7px;background:white;padding:8px;border-radius:17px;box-shadow:var(--shadow)}
.searchbox input{min-width:0;flex:1;border:0;outline:0;background:#f2f7f6;border-radius:11px;padding:0 12px;font-size:15px;color:var(--ink);height:46px}
button{font:inherit;cursor:pointer;border:0}
.primary{background:var(--teal);color:#032f34;font-weight:800;border-radius:12px;padding:0 16px;min-height:44px}
.iconbtn{width:45px;min-width:45px;height:45px;border-radius:13px;background:white;color:var(--navy);box-shadow:var(--shadow);font-size:20px}
.actions{position:absolute;z-index:500;left:13px;top:48%;display:flex;flex-direction:column;gap:9px}
.status{position:absolute;z-index:500;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 148px);background:#062c35f2;color:white;border-radius:15px;padding:11px 13px;box-shadow:var(--shadow);font-size:13px;display:none;line-height:1.5}
.bottom{position:absolute;z-index:500;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;background:white;border-radius:22px;padding:13px;box-shadow:var(--shadow)}
.bottomrow{display:flex;align-items:center;gap:9px}.routeinfo{flex:1;min-width:0}.route-title{font-weight:800;font-size:15px}.route-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.reportbtn{background:#fff0e7;color:#a84a17;border-radius:13px;padding:12px 13px;font-weight:750;white-space:nowrap}
.smallrow{display:flex;gap:7px;margin-top:11px}.secondary{background:#f0f6f5;color:#21434a;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;color:#087e72;font-weight:750;font-size:11px;margin-top:7px}
.sheetback{display:none;position:absolute;inset:0;z-index:1000;background:#001c2280;align-items:flex-end}
.sheet{background:white;width:100%;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:var(--shadow)}
.sheet h2{margin:0 0 8px;font-size:19px}.sheet p{color:var(--muted);font-size:13px;margin:0 0 15px}
.report-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.report-options button{border:1px solid var(--line);background:#f7faf9;border-radius:13px;padding:15px 8px;font-weight:700;color:var(--ink)}
.report-options button span{display:block;font-size:22px;margin-bottom:6px}
.toast{position:absolute;z-index:1500;top:calc(env(safe-area-inset-top) + 175px);left:14px;right:14px;background:#072f38;color:white;padding:13px 15px;border-radius:13px;box-shadow:var(--shadow);display:none;font-size:13px}
@media(min-width:700px){.top{left:auto;width:390px}.bottom{right:auto;width:390px}.status{right:auto;width:390px}.actions{left:auto;right:420px}.toast{left:auto;right:15px;width:360px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="brand">
    <div class="logo">➤</div>
    <div><div class="brandname">مابويز</div><div class="tag">ملاحتك داخل العراق</div></div>
    <div class="spacer"></div><div class="pill">نسخة تجريبية</div>
  </div>
  <div class="searchbox">
    <input id="destination" type="search" placeholder="وين تريد تروح؟" autocomplete="off">
    <button class="primary" id="goBtn">اذهب</button>
  </div>
</div>
<div class="actions">
  <button class="iconbtn" id="locateBtn" aria-label="موقعي" title="موقعي">◎</button>
  <button class="iconbtn" id="clearBtn" aria-label="مسح المسار" title="مسح المسار">×</button>
</div>
<div id="toast" class="toast"></div>
<div id="status" class="status"></div>
<div class="bottom">
  <div class="bottomrow">
    <div class="routeinfo">
      <div class="route-title" id="routeTitle">جاهز للانطلاق؟</div>
      <div class="route-sub" id="routeSub">ابحث عن مكان أو اضغط مطولاً على الخريطة لاختيار وجهة.</div>
      <div class="badge">● الخريطة الأساسية جاهزة</div>
    </div>
    <button class="reportbtn" id="reportBtn">⚠ بلاغ</button>
  </div>
  <div class="smallrow">
    <button class="secondary" id="shareBtn">مشاركة موقعي</button>
    <button class="secondary" id="centerBtn">عرض العراق</button>
  </div>
</div>
<div class="sheetback" id="sheetBack">
  <div class="sheet">
    <h2>بلّغ عن مشكلة بالطريق</h2>
    <p>اختر نوع البلاغ. في هذه النسخة التجريبية، البلاغ يظهر على جهازك فقط ولا يصل للسائقين الآخرين.</p>
    <div class="report-options">
      <button data-report="حادث مروري"><span>🚗</span>حادث مروري</button>
      <button data-report="ازدحام"><span>🚦</span>ازدحام</button>
      <button data-report="طريق مغلق"><span>⛔</span>طريق مغلق</button>
      <button data-report="حفرة أو عائق"><span>⚠️</span>حفرة أو عائق</button>
    </div>
    <button class="secondary" style="width:100%;margin-top:12px" id="closeSheet">إلغاء</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const baghdad = [33.3152, 44.3661];
  const map = L.map('map', {zoomControl:false}).setView(baghdad, 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  L.control.zoom({position:'bottomleft'}).addTo(map);

  let current = null, currentMarker = null, destinationMarker = null, routeLayer = null;
  let reports = [], destinationName = '';
  const status = $('status');
  function say(message, persistent=false) {
    status.textContent = message; status.style.display = 'block';
    if (!persistent) setTimeout(() => { if(status.textContent===message) status.style.display='none'; }, 5500);
  }
  function toast(message) {
    $('toast').textContent = message; $('toast').style.display = 'block';
    setTimeout(() => $('toast').style.display = 'none', 3500);
  }
  function setCurrent(latlng) {
    current = latlng;
    if (currentMarker) currentMarker.setLatLng(latlng);
    else currentMarker = L.circleMarker(latlng, {radius:8,color:'#fff',weight:4,fillColor:'#008f88',fillOpacity:1}).addTo(map).bindPopup('موقعك الحالي');
  }
  function destinationIcon() {
    return L.divIcon({className:'',html:'<div style="font-size:32px;filter:drop-shadow(0 2px 2px #0004)">📍</div>',iconSize:[30,34],iconAnchor:[15,32]});
  }
  function setDestination(latlng, name) {
    if(destinationMarker) map.removeLayer(destinationMarker);
    destinationMarker = L.marker(latlng,{icon:destinationIcon()}).addTo(map);
    destinationName = name || 'الوجهة المحددة';
    $('routeTitle').textContent = destinationName.split(',')[0];
    $('routeSub').textContent = 'جاري حساب أفضل مسار متاح...';
    route(latlng);
  }
  async function locate() {
    if(!navigator.geolocation) { say('المتصفح لا يدعم تحديد الموقع.'); return; }
    say('جاري تحديد موقعك…', true);
    navigator.geolocation.getCurrentPosition(pos => {
      const ll=[pos.coords.latitude,pos.coords.longitude]; setCurrent(ll); map.setView(ll,15);
      say('تم تحديد موقعك بنجاح.');
    }, err => {
      say('لم نتمكن من تحديد الموقع. اسمح لسفاري بالوصول إلى الموقع وتأكد من تشغيل GPS.');
    }, {enableHighAccuracy:true,timeout:15000,maximumAge:10000});
  }
  async function search() {
    const q=$('destination').value.trim();
    if(!q){toast('اكتب اسم المكان أو العنوان أولاً.');return;}
    say('جاري البحث عن الوجهة…',true);
    try {
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=iq&accept-language=ar&q='+encodeURIComponent(q);
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('تعذر البحث حالياً.');
      const data=await r.json();
      if(!data.length) throw new Error('لم نعثر على المكان. جرّب كتابة الاسم مع المحافظة.');
      const p=data[0], ll=[Number(p.lat),Number(p.lon)];
      setDestination(ll,p.display_name);
      if(current) map.fitBounds([current,ll],{paddingTopLeft:[25,180],paddingBottomRight:[25,210],maxZoom:15});
      else map.setView(ll,14);
      say('تم العثور على الوجهة.');
    } catch(e) {say(e.message || 'حدث خطأ أثناء البحث.');}
  }
  async function route(dest) {
    if(!current) {
      $('routeSub').textContent='تم تحديد الوجهة. اضغط زر الموقع لحساب مسار من موقعك.';
      map.setView(dest,14); return;
    }
    try {
      const coords=`${current[1]},${current[0]};${dest[1]},${dest[0]}`;
      const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
      const r=await fetch(url);
      if(!r.ok) throw new Error('خدمة المسارات غير متاحة الآن.');
      const data=await r.json();
      if(data.code!=='Ok'||!data.routes?.length) throw new Error('لم يتوفر مسار لهذه الوجهة.');
      const best=data.routes[0];
      const points=best.geometry.coordinates.map(c=>[c[1],c[0]]);
      if(routeLayer) map.removeLayer(routeLayer);
      routeLayer=L.polyline(points,{color:'#00a99d',weight:6,opacity:.9}).addTo(map);
      const km=(best.distance/1000).toFixed(1), mins=Math.round(best.duration/60);
      $('routeSub').textContent=`المسافة ${km} كم • وقت تقريبي ${mins} دقيقة. لا تتوفر بيانات ازدحام حي حالياً.`;
      map.fitBounds(routeLayer.getBounds(),{paddingTopLeft:[25,180],paddingBottomRight:[25,210],maxZoom:15});
      say('تم حساب المسار التقريبي.');
    } catch(e) {
      $('routeSub').textContent=e.message+' يمكنك استخدام الخريطة لتحديد الوجهة.';
      say(e.message);
    }
  }
  $('goBtn').addEventListener('click',search);
  $('destination').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  $('locateBtn').addEventListener('click',locate);
  $('centerBtn').addEventListener('click',()=>map.setView([33.0,43.5],6));
  $('clearBtn').addEventListener('click',()=>{
    if(destinationMarker)map.removeLayer(destinationMarker);
    if(routeLayer)map.removeLayer(routeLayer);
    destinationMarker=null;routeLayer=null;destinationName='';
    $('routeTitle').textContent='جاهز للانطلاق؟';
    $('routeSub').textContent='ابحث عن مكان أو اضغط مطولاً على الخريطة لاختيار وجهة.';
    say('تم مسح المسار.');
  });
  map.on('contextmenu',e=>setDestination([e.latlng.lat,e.latlng.lng],'وجهة محددة على الخريطة'));
  $('reportBtn').addEventListener('click',()=>$('sheetBack').style.display='flex');
  $('closeSheet').addEventListener('click',()=>$('sheetBack').style.display='none');
  $('sheetBack').addEventListener('click',e=>{if(e.target===$('sheetBack'))$('sheetBack').style.display='none';});
  document.querySelectorAll('[data-report]').forEach(btn=>btn.addEventListener('click',()=>{
    const type=btn.dataset.report;
    const ll=current||map.getCenter();
    const marker=L.marker(ll).addTo(map).bindPopup('بلاغ تجريبي: '+type+'<br>غير مرسل إلى خادم').openPopup();
    reports.push({type,marker});
    $('sheetBack').style.display='none';
    toast('تمت إضافة البلاغ على هذا الجهاز فقط.');
  }));
  $('shareBtn').addEventListener('click',async()=>{
    if(!current){await locate();if(!current)return;}
    const url=`https://www.google.com/maps?q=${current[0]},${current[1]}`;
    try {
      if(navigator.share) await navigator.share({title:'موقعي عبر مابويز',text:'موقعي الحالي',url});
      else {await navigator.clipboard.writeText(url);toast('تم نسخ رابط الموقع.');}
    } catch(e) {toast('تعذر مشاركة الموقع.');}
  });
  // Attempt to get a location once the page loads. Browser asks permission.
  setTimeout(()=>{if(navigator.geolocation)locate();},700);
})();
</script>
</body>
</html>
